name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4

      # The "Inject CarPlay Certificates" step was removed. It copied files out of the
      # official release APK into the source tree, which is exactly what the
      # :mobile:rejectBundledCredentials guard stops.

      - name: Source-only debug build
        run: ./gradlew :mobile:assembleDebug --stacktrace
        # Full upstream check, if you want it back:
        # ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest \
        #   :mobile:lintDebug :home:lintDebug :maphost:lintDebug \
        #   :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: diplay-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
