name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Inject CarPlay Certificates
        run: |
          wget https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.19/DiPlay-0.2.19.apk -O official.apk
          unzip -q -o official.apk "assets/*" -d extracted_assets || true
          mkdir -p mobile/src/main/assets shared/src/main/assets common/src/main/assets
          cp -r extracted_assets/assets/* mobile/src/main/assets/ 2>/dev/null || true
          cp -r extracted_assets/assets/* shared/src/main/assets/ 2>/dev/null || true
          cp -r extracted_assets/assets/* common/src/main/assets/ 2>/dev/null || true

      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
